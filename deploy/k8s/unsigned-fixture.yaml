# This Pod is deliberately unsigned but otherwise satisfies the hardening
# policy. Kyverno must reject it solely because the image has no valid
# Sigstore signature from the DevOps Security Pipeline workflow.
apiVersion: v1
kind: Pod
metadata:
  name: unsigned-fixture
  labels:
    app.kubernetes.io/name: unsigned-fixture
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: unsigned
      image: nginx:1.27.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
