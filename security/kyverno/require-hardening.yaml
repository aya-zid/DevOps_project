apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-irongate-hardening
  annotations:
    policies.kyverno.io/title: Require container hardening
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Enforce non-root execution, a read-only root filesystem, no privilege
      escalation, dropped capabilities, and resource limits for Pods in the
      irongate namespace.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - irongate
      validate:
        message: >-
          Pods must run as non-root with a read-only root filesystem, no
          privilege escalation, and all capabilities dropped.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL

    - name: require-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - irongate
      validate:
        message: "Every container must define CPU and memory requests and limits."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"

    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - irongate
      validate:
        message: "Images must be pinned to a digest or an explicit non-latest tag."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
