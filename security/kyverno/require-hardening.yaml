apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-irongate-hardening
  annotations:
    policies.kyverno.io/title: Require container hardening
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Enforce non-root execution, a read-only root filesystem, no privilege
      escalation, dropped capabilities, explicit tags, and resource limits for
      Pods in the irongate namespace.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - irongate
      validate:
        message: "Pods must set runAsNonRoot: true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true

    - name: require-container-hardening
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - irongate
      validate:
        message: >-
          Every container must disable privilege escalation, use a read-only
          root filesystem, and drop all capabilities.
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL

    - name: require-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - irongate
      validate:
        message: "Every container must define CPU and memory requests and limits."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"

    - name: require-explicit-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - irongate
      validate:
        message: "Images must include an explicit tag or digest."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              image: "*:*"

    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - irongate
      validate:
        message: "Images must be pinned to a digest or an explicit non-latest tag."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              image: "!*:latest"
